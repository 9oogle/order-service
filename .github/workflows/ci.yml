name: CI

on:
  pull_request:
    branches: ["dev"]
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build and test
        run: ./gradlew clean build
        env:
          GitHubPackagesUsername: ${{ secrets.PACKAGES_USERNAME }}
          GitHubPackagesPassword: ${{ secrets.PACKAGES_PASSWORD }}