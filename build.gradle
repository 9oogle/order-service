plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.13'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '6.25.0'
}

group = 'com.goggles'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
	maven {
		url = uri("https://maven.pkg.github.com/9oogle/common-library")
		credentials {
			username = providers.gradleProperty("GitHubPackagesUsername").get()
			password = providers.gradleProperty("GitHubPackagesPassword").get()
		}
	}
}

def generated = 'build/generated/main'

ext {
	set('springCloudVersion', "2025.0.2")
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += ["-parameters"]
	options.getGeneratedSourceOutputDirectory().set(file(generated))
	dependsOn 'spotlessJava'
}

sourceSets {
	main.java.srcDirs += [generated]
}

clean {
	delete file(generated)
}

dependencies {
	// common-library
	implementation("com.goggles:common-library:1.0.6")

	// slack
	implementation 'com.slack.api:slack-api-client:1.48.0'

	// spring boot
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// spring boot cloud
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
	implementation 'org.springframework.cloud:spring-cloud-starter-config'

	// kafka
	implementation 'org.springframework.kafka:spring-kafka'

	// zipkin
	implementation 'io.micrometer:micrometer-tracing-bridge-brave'
	implementation 'io.zipkin.reporter2:zipkin-reporter-brave'
	implementation 'io.micrometer:micrometer-registry-prometheus'

	// swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.16'

	// lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// db
	runtimeOnly 'org.postgresql:postgresql'

	// querydsl
	implementation "com.querydsl:querydsl-jpa:5.1.0:jakarta"
	annotationProcessor "com.querydsl:querydsl-apt:5.1.0:jakarta"
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"
	annotationProcessor "jakarta.annotation:jakarta.annotation-api"

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'org.mockito:mockito-core'
	testRuntimeOnly  'net.bytebuddy:byte-buddy-agent'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

spotless {
	java {
		googleJavaFormat('1.19.2')
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
		target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.withType(Test).configureEach {
	def byteBuddyAgent = configurations.testRuntimeClasspath.files.find { it.name.startsWith('byte-buddy-agent-') }
		if (byteBuddyAgent == null) {
			throw new GradleException("byte-buddy-agent를 testRuntimeClasspath에서 찾을 수 없습니다.")
		}
	jvmArgs "-javaagent:${byteBuddyAgent.absolutePath}"
}

